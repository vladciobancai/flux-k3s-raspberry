apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-blueresourcecloud
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/blueresourcecloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: blueresourcecloud
  wait: true
