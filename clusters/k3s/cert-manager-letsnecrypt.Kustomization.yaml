apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-letsnecrypt
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-release
  interval: 10m
  path: ./infrastructure/cert-manager/letsnecrypt
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: cert-manager
  wait: true
