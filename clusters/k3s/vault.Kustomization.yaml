apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: flux-system
spec:
  dependsOn:
    - name: local-path-provisioner
  interval: 10m
  path: ./infrastructure/vault
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: vault
  wait: true
