apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
  interval: 10m
  path: ./infrastructure/trivy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: aqua
  wait: true
