---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare
spec:
  interval: 10m0s
  chart:
    spec:
      chart: cloudflare-tunnel
      version: 0.3.2
      sourceRef:
        kind: HelmRepository
        name: cloudflare-tunnel
  timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    cloudflare:
      secretName: cloudflare-tunnel-credentials