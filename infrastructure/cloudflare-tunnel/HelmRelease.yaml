---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare
spec:
  interval: 10m0s
  chart:
    spec:
      chart: cloudflare-tunnel
      version: 0.3.2
      sourceRef:
        kind: HelmRepository
        name: cloudflare-tunnel
  timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    image:
      tag: "2026.1.2"
    cloudflare:
      tunnelName: 'k3s-raspberryPi'
      secretName: cloudflare-tunnel-credentials
      ingress:
        - hostname: vladciobancai.ro
          service: http://svc-vladciobancai.vladciobancai.svc.cluster.local
        - hostname: gotify.vladciobancai.ro
          service: http://gotify-headless.gotify.svc.cluster.local
    replicaCount: 2
