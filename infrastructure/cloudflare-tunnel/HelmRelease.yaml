---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare
spec:
  interval: 10m0s
  chart:
    spec:
      chart: cloudflare-tunnel
      version: 0.3.2
      sourceRef:
        kind: HelmRepository
        name: cloudflare-tunnel
  timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    cloudflare:
      tunnelName: 'k3s-raspberryPi'
      secretName: cloudflare-tunnel-credentials
      # ingress:
      #   - hostname: k3s-grafana.blueresource.cloud
      #     service: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
    replicaCount: 1
