---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: github
  namespace: flux-system
spec:
  type: github
  address: https://github.com/vladciobancai/flux-k3s-raspberry
  secretRef:
    name: github-token
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: github-commit-status
  namespace: flux-system
spec:
  eventMetadata:
    env: "production"
    cluster: "k3s_raspberry-pi5"
    region: "ro"
  providerRef:
    name: github
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
