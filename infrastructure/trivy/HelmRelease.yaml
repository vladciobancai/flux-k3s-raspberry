---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: aqua
spec:
  interval: 10m
  chart:
    spec:
      chart: trivy-operator
      version: 0.31.0
      sourceRef:
        kind: HelmRepository
        name: aqua
  upgrade:
    crds: CreateReplace
  values:
    compliance:
      reportType: summary
      cron: "0 0 * * *"
    trivy:
      ignoreUnfixed: true
      mode: ClientServer
      serverURL: "http://trivy-server.aqua:4954"
      serverInsecure: true
      severity: "HIGH,CRITICAL"
      slow: true
      storageClassEnabled: true
      storageClassName: nvme-local
      storageSize: "10Gi"
      vulnType: "library, os"
    operator:
      scanJobsConcurrentLimit: 5
      builtInTrivyServer: true
    serviceMonitor:
      enabled: true