---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 10m0s
  chart:
    spec:
      chart: vault
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  timeout: 10m
  values:
    server:
      standalone:
        enabled: '-'
        config: |
          disable_mlock = true
          ui = true
          
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            # Enable unauthenticated metrics access (necessary for Prometheus Operator)
            #telemetry {
            #  unauthenticated_metrics_access = "true"
            #}
          }
          
          storage "file" {
            path = "/vault/data"
          }
          
          seal "transit" {
            address = "http://vault.vault:8200"
            token = "hvs.CAESIFAewCw3vdTe7TT4LIyTaoMad-MNNQ3tnJhh15n6sZkjGh4KHGh2cy5RbXhxbmVTcERVUm04VXc0N0FaU0t0aXc"
            disable_renewal = "false"
            key_name = "autounseal"
            mount_path = "transit/"
            tls_skip_verify = "true"
          }
