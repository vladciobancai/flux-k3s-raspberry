---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 10m0s
  chart:
    spec:
      chart: vault
      version: 0.31.0
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  timeout: 10m
  values:
    server:
      affinity: ""
      standalone:
        enabled: true
    datastorage:
      enabled: true
      storageClass: nvme-local
