---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 10m0s
  chart:
    spec:
      chart: vault
      version: 0.31.0
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  timeout: 10m
  values:
    server:
      affinity: ""
      standalone:
        enabled: true
      postStart:
        - sh
        - -c
        - |
          sleep 10
          vault operator init >> /tmp/init.txt
          cat /tmp/init.txt | grep "Key " | awk '{print $NF}' | xargs -I{} vault operator unseal {}
          rm /tmp/init.txt
    datastorage:
      enabled: true
      storageClass: nvme-local
