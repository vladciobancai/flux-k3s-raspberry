---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 10m0s
  chart:
    spec:
      chart: vault
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  timeout: 10m
  values:
    server:
      extraSecretEnvironmentVars:
        - envName: VAULT_TOKEN
          secretName: vault
          secretKey: VAULT_TOKEN
        affinity: ""
      standalone:
        enabled: true
        config: |
          disable_mlock = true
          ui = true
          
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          
          storage "file" {
            path = "/vault/data"
          }

          service_registration "kubernetes" {}
          
          seal "transit" {
            address = "http://vault:8200"
            disable_renewal = "false"
            key_name        = "autounseal"
            mount_path      = "transit/"
            tls_skip_verify = "true"
          }
