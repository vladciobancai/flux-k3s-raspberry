---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: local-path-storage
  namespace: local-path-storage
spec:
  interval: 10m0s
  chart:
    spec:
      chart: local-path-provisioner
      version: 0.0.33
      sourceRef:
        kind: HelmRepository
        name: ilocal-path-storage
  timeout: 20m
  upgrade:
    crds: CreateReplace
  values:
    storageClass:
      create: true
      name: nvme-local
      defaultClass: true
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer

    nodePathMap:
      - node: "raspberrypi"
        paths:
          - /mnt/nvme