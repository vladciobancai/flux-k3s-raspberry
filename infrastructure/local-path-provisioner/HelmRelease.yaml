---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 10m
  chart:
    spec:
      chart: local-path-provisioner
      version: 0.0.34
      sourceRef:
        kind: HelmRepository
        name: rancher-oci
  values:
    storageClass:
      create: true
      name: nvme-local
      defaultClass: true
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer

    nodePathMap:
      - node: "raspberrypi"
        paths:
          - /mnt/nvme
