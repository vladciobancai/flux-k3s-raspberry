apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    metrics: 0.0.0.0:20000
    no-autoupdate: true
    ingress:
      # Forward all incoming traffic to Traefik HTTP entrypoint
      - hostname: home.linuxdns.work
        service: http://home-assistant.home-assistant.svc.cluster.local:8080