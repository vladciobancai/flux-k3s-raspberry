apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    metrics: 0.0.0.0:20000
    no-autoupdate: true
    config.yaml: |
        ingress:
          # Forward all incoming traffic to Traefik in the 'traefik' namespace
          - service: http://traefik.traefik.svc.cluster.local:80
          # Required catch-all 404 rule
          - service: http_status:404