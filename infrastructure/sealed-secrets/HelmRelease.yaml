---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  interval: 10m0s
  chart:
    spec:
      chart: sealed-secrets
      version: 2.17.7
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
  timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: sealed-secrets-controller
