---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m0s
  chart:
    spec:
      chart: traefik
      version: 43.0.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  timeout: 20m
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      kind: "Deployment"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    api:
      dashboard: true
    ingressRoute:
      dashboard:
        enabled: true
    metrics:
      addInternals: true
      prometheus:
        serviceMonitor:
          additionalLabels:
            release: prom-stack
          enabled: true