---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m0s
  chart:
    spec:
      chart: traefik
      version: 43.0.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  timeout: 20m
  upgrade:
    crds: CreateReplace
  values:
    api:
      dashboard: true
    autoscaling:
      enabled: true
      maxReplicas: 2
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
    deployment:
      replicas: null
    ingressRoute:
      dashboard:
        enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "50Mi"
      limits:
        cpu: "300m"
        memory: "150Mi"
    metrics:
      addInternals: true
      prometheus:
        serviceMonitor:
          additionalLabels:
            release: prom-stack
          enabled: true
    ports:
      web:
        # -- If you are handling ACME HTTP challenges with another service (e.g. cert-manager),
        #    you may enable this option to prevent redirects on ACME challenge routes for this port.
        # allowACMEByPass: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
