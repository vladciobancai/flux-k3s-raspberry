---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m0s
  chart:
    spec:
      chart: traefik
      version: 43.0.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  timeout: 20m
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      kind: "Deployment"
    ingressRoute:
      dashboard:
        enabled: true
        domain: traefik.linuxdns.work
        ingressRoute:
          annotations:
            kubernetes.io/ingress.class: traefik
            cert-manager.io/cluster-issuer: "letsencrypt-production"
            traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
            traefik.ingress.kubernetes.io/router.tls: "true"
          tls:
            secretName: traefik-tls
    metrics:
      prometheus:
        serviceMonitor:
          additionalLabels:
            release: prom-stack
          enabled: true