---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 10m
  chart:
    spec:
      chart: home-assistant
      version: 0.3.32
      sourceRef:
        kind: HelmRepository
        name: pajikos
  values:
    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: nginx
      hosts:
        - host: home-assistant.vladciobancai.ro
          paths:
            - path: /
              pathType: Prefix
    nodeSelector:
      kubernetes.io/hostname: "raspberrypi"
    persistence:
      enabled: true
      size: 20Gi
      storageClass: nvme-local
