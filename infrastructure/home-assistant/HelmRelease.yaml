---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 10m
  chart:
    spec:
      chart: home-assistant
      version: 0.3.91
      sourceRef:
        kind: HelmRepository
        name: pajikos
  timeout: 30m0s
  values:
    configuration:
      enabled: true
      forceInit: true
      trusted_proxies:
        - 10.42.0.0/16      # Add the IP address of your cluster CIDR
      templateConfig: |-
        # Loads default set of integrations. Do not remove.
        default_config:

        {{- if .Values.ingress.enabled }}
        {{- end}}
        # Load frontend themes from the themes folder
        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: traefik
      hosts:
        - host: home-assistant.vladciobancai.ro
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
      size: 20Gi
    serviceMonitor:
      enabled: true
      scrapeInterval: 30s
      labels:
        release: prometheus
