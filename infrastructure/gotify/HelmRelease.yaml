---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotify
  namespace: gotify
spec:
  interval: 10m
  chart:
    spec:
      chart: gotify
      version: 0.8.0
      sourceRef:
        kind: HelmRepository
        name: gotify
  values:
    server:
      timezone: "Europe/Bucharest"
