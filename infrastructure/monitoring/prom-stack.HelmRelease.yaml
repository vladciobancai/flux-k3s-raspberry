---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 77.11.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    grafana:
      enabled: false
    alertmanager:
      enabled: false
    prometheus:
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 1d
        storageSpec:
           volumeClaimTemplate:
              spec:
                storageClassName: nvme-local
                resources:
                  requests:
                    storage: 10Gi
