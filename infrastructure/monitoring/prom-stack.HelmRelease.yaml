---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 66.3.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  timeout: 10m
  upgrade:
    crds: CreateReplace
  install:
    createNamespace: true 
