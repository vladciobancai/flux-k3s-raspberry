---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 80.4.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    grafana:
      enabled: true
      initChownData:
        enabled: false
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: nginx
        hosts:
          - grafana.vladciobancai.ro
      persistence:
        enabled: true
        size: 5Gi
        storageClassName: nvme-local
    alertmanager:
      enabled: false
    prometheus:
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        storageSpec:
           volumeClaimTemplate:
              spec:
                storageClassName: nvme-local
                resources:
                  requests:
                    storage: 10Gi
