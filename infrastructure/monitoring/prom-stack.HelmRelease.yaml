---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    grafana:
      enabled: true
      initChownData:
        enabled: false
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: traefik
        hosts:
          - grafana.vladciobancai.ro
      persistence:
        enabled: true
        size: 5Gi
    alertmanager:
      enabled: false
    grafana.ini:
      server:
        root_url: https://grafana.vladciobancai.ro
      auth.anonymous:
        enabled: true
        org_name: Main Org.
        org_role: Admin
      auth:
        disable_login_form: true
    prometheus:
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        storageSpec:
           volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 10Gi
