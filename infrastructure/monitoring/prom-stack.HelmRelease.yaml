---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.7.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  timeout: 10m
  upgrade:
    crds: CreateReplace
  values:
    grafana:
      enabled: true
      initChownData:
        enabled: false
      ingress:
        enabled: true
        annotations:
          kubernetes.io/ingress.class: traefik
          cert-manager.io/cluster-issuer: "letsnecrypt-production"
        hosts:
          - grafana.linuxdns.work
        tls:
          - secretName: grafana-tls # cert-manager will store the TLS certificate in this secret
            hosts:
              - grafana.linuxdns.work
      grafana.ini:
        server:
          root_url: https://grafana.linuxdns.work
      persistence:
        enabled: true
        size: 5Gi
    alertmanager:
      enabled: false
    prometheus:
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 10Gi
